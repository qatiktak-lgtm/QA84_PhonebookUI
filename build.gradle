plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.40.0")
    implementation("org.testng:testng:7.11.0")

    implementation("io.github.bonigarcia:webdrivermanager:6.3.4")
}

// Конфигурация по умолчанию для стандартной команды: gradle test
test {
    useTestNG()

    // Пробрасываем параметр -Pbrowser в системные свойства Java
    if (project.hasProperty('browser')) {
        systemProperty 'browser', project.getProperty('browser')
    }

    testLogging {
        events = ["passed", "skipped", "failed", "standardOut", "standardError"]
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

// Кастомная задача qa, которая полностью наследует логику от test
task qa(type: Test) {
    // Явно указываем задачи, откуда брать скомпилированные классы тестов
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false } // Не кэшировать запуск

    useTestNG()

    if (project.hasProperty('browser')) {
        systemProperty 'browser', project.getProperty('browser')
    }

    testLogging {
        events = ["passed", "skipped", "failed", "standardOut", "standardError"]
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}