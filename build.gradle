plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.40.0")
    implementation("org.testng:testng:7.11.0")

    implementation("io.github.bonigarcia:webdrivermanager:6.3.4")
    implementation("ch.qos.logback:logback-classic:1.6.3")
}

// Конфигурация по умолчанию для стандартной команды: gradle test
test {
    useTestNG()

    // Пробрасываем параметр -Pbrowser в системные свойства Java
    if (project.hasProperty('browser')) {
        systemProperty 'browser', project.getProperty('browser')
    }

    testLogging {
        events = ["passed", "skipped", "failed", "standardOut", "standardError"]
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

// Кастомная задача qa, которая полностью наследует логику от test
task qa(type: Test) {
    // Явно указываем задачи, откуда брать скомпилированные классы тестов
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false } // Не кэшировать запуск

    useTestNG()

    if (project.hasProperty('browser')) {
        systemProperty 'browser', project.getProperty('browser')
    }

    testLogging {
        events = ["passed", "skipped", "failed", "standardOut", "standardError"]
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

def registerTask(String taskName, String suitePath){
    tasks.register(taskName, Test){
        useTestNG(){
            suites suitePath
        }
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath

        // Отключаем кэширование, чтобы тест запускался всегда
        outputs.upToDateWhen { false }

        if (project.hasProperty('browser')) {
            systemProperty 'browser', project.getProperty('browser')
        }

        // Логирование результатов в консоль
        testLogging {
            events = ["passed", "skipped", "failed", "standardOut", "standardError"]
            showStandardStreams = true
        }
    }
}

registerTask('quick', 'src/test/resources/quick.xml')
registerTask('regr', 'src/test/resources/regression.xml')